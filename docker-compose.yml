services:
  redis:
    image: redis:7-alpine
    container_name: rl_redis
    ports:
      - "6379:6379"
    networks:
      - rl-network
  app1:
    build: .
    container_name: rl_app1
    environment:
      - REDIS_HOST=redis
      - REDIS_port=6379
    networks:
      - rl-network
    depends_on:
      - redis
  app2:
    build: .
    container_name: rl_app2
    environment:
      - REDIS_HOST=redis
      - REDIS_port=6379
    networks:
      - rl-network
    depends_on:
      - redis

  app3:
    build: .
    container_name: rl_app3
    environment:
      - REDIS_HOST=redis
      - REDIS_port=6379
    networks:
      - rl-network
    depends_on:
      - redis
  nginx:
    image: nginx:alpine
    container_name: rl_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # the official nginx:alpine image ships with its own default nginx.conf baked into the image, which serves as a placeholder welcome page.
      # The volume line above bind-mounts the local ./nginx/nginx.conf from the host into etc/nginx/nginx.conf inside the container.
      # The local conf file replaces the images default conf file
    networks:
      - rl-network
    depends_on:
      - app1
      - app2
      - app3

networks:
  rl-network:
    driver: bridge
