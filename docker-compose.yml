services:
  redis:
    image: redis:7-alpine
    container_name: rl_redis
    ports:
      - "6379:6379"
    networks:
      - rl-network
  app1:
    build: .
    container_name: rl_app1
    environment:
      - REDIS_HOST=redis
      - REDIS_port=6379
    networks:
      - rl-network
    depends_on:
      - redis
  app2:
    build: .
    container_name: rl_app2
    environment:
      - REDIS_HOST=redis
      - REDIS_port=6379
    networks:
      - rl-network
    depends_on:
      - redis

  app3:
    build: .
    container_name: rl_app3
    environment:
      - REDIS_HOST=redis
      - REDIS_port=6379
    networks:
      - rl-network
    depends_on:
      - redis
  nginx:
    image: nginx:alpine
    container_name: rl_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # the official nginx:alpine image ships with its own default nginx.conf baked into the image, which serves as a placeholder welcome page.
      # The volume line above bind-mounts the local ./nginx/nginx.conf from the host into etc/nginx/nginx.conf inside the container.
      # The local conf file replaces the images default conf file
    networks:
      - rl-network
    depends_on:
      - app1
      - app2
      - app3
  prometheus:
    image: prom/prometheus:latest
    container_name: rl_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - rl-network
    depends_on:
      - app1
      - app2
      - app3

  grafana:
    image: grafana/grafana:latest
    container_name: rl_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - rl-network
    depends_on:
      - prometheus
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: rl_uptime_kuma
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - rl-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: rl_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - rl-network
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: rl_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - rl-network
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: rl_filebeat
    user: root
    command: ["-environment", "container", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - rl-network
    depends_on:
      - elasticsearch

volumes:
  uptime-kuma-data:
  es-data:

networks:
  rl-network:
    driver: bridge
